<!-- 
  Prompt: Twitter-like website for sharing text without a server using URL hashtag state + Delete Feature
  Date & Time (IST): Wednesday, October 28, 2026 at 8:40 PM IST
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HashTweet - Serverless Text Sharing</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --border: #334155;
      --danger: #ef4444;
      --danger-hover: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 20px 10px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .composer {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    textarea {
      width: 100%;
      height: 100px;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 1rem;
      resize: none;
      outline: none;
    }

    textarea::placeholder {
      color: var(--text-muted);
    }

    .composer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    .char-count {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .btn {
      background: var(--accent);
      color: #000;
      font-weight: 600;
      border: none;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--border);
    }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    .btn-danger:hover {
      background: var(--danger);
      color: #fff;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .card-content {
      font-size: 1.05rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .card-actions {
      display: flex;
      gap: 10px;
      margin-top: 5px;
    }

    .alert {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }

    .timeline-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-top: 10px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo">⚡ HashTweet</div>
      <button class="btn btn-secondary" onclick="exportHTML()">⬇️ Export .html</button>
    </header>

    <div id="alertBox" class="alert"></div>

    <!-- Create Post Section -->
    <div class="composer">
      <textarea id="tweetInput" maxlength="280" placeholder="What's happening? (Encoded directly into URL hash)"></textarea>
      <div class="composer-actions">
        <span class="char-count" id="charCount">280 left</span>
        <button class="btn" onclick="generateTweetLink()">Create Link & Share 🚀</button>
      </div>
    </div>

    <!-- Active Shared Tweet Displayed Here -->
    <div id="viewSection" style="display: none;">
      <div class="card" style="border-color: var(--accent);">
        <div class="card-header">
          <span>📌 Shared via URL Hash</span>
          <span id="sharedTime">Just now</span>
        </div>
        <div class="card-content" id="sharedContent"></div>
        <div class="card-actions">
          <button class="btn btn-secondary" onclick="copyCurrentLink()">📋 Copy Share Link</button>
          <button class="btn btn-secondary" onclick="saveToLocalTimeline()">⭐ Save to Local Feed</button>
        </div>
      </div>
    </div>

    <!-- Local Timeline Feed -->
    <div class="timeline-title">Saved Posts Feed</div>
    <div id="timeline"></div>
  </div>

  <script>
    const tweetInput = document.getElementById('tweetInput');
    const charCount = document.getElementById('charCount');
    const alertBox = document.getElementById('alertBox');
    const viewSection = document.getElementById('viewSection');
    const sharedContent = document.getElementById('sharedContent');

    // Update character counter
    tweetInput.addEventListener('input', () => {
      charCount.textContent = `${280 - tweetInput.value.length} left`;
    });

    // Encode text to Base64 (UTF-8 safe)
    function encodeText(str) {
      return btoa(encodeURIComponent(str));
    }

    // Decode Base64 to UTF-8 text
    function decodeText(str) {
      try {
        return decodeURIComponent(atob(str));
      } catch (e) {
        return null;
      }
    }

    // Generate Shareable URL Hash
    function generateTweetLink() {
      const text = tweetInput.value.trim();
      if (!text) {
        showAlert('Please write some text first!');
        return;
      }

      const hash = encodeText(text);
      const shareableURL = `${window.location.origin}${window.location.pathname}#post=${hash}`;
      
      window.location.hash = `post=${hash}`;

      navigator.clipboard.writeText(shareableURL).then(() => {
        showAlert('✅ Link copied to clipboard! Share it anywhere.');
      });

      tweetInput.value = '';
      charCount.textContent = '280 left';
      checkUrlHash();
    }

    // Check URL Hash on page load/hash change
    function checkUrlHash() {
      const hash = window.location.hash;
      if (hash.startsWith('#post=')) {
        const encodedData = hash.replace('#post=', '');
        const decodedText = decodeText(encodedData);
        if (decodedText) {
          sharedContent.textContent = decodedText;
          viewSection.style.display = 'block';
        }
      }
    }

    // Copy Current Page URL
    function copyCurrentLink() {
      navigator.clipboard.writeText(window.location.href).then(() => {
        showAlert('📋 Share link copied!');
      });
    }

    // Save to browser's Local Storage Timeline
    function saveToLocalTimeline() {
      const text = sharedContent.textContent;
      if (!text) return;

      let saved = JSON.parse(localStorage.getItem('hashtweets') || '[]');
      saved.unshift({ text, date: new Date().toLocaleTimeString() });
      localStorage.setItem('hashtweets', JSON.stringify(saved));
      renderTimeline();
      showAlert('⭐ Post saved to your local timeline!');
    }

    // Delete a specific post from local storage feed
    function deletePost(index) {
      let saved = JSON.parse(localStorage.getItem('hashtweets') || '[]');
      saved.splice(index, 1); // Remove the post at that index
      localStorage.setItem('hashtweets', JSON.stringify(saved));
      renderTimeline();
      showAlert('🗑️ Post deleted from your local timeline.');
    }

    // Render Saved Feed with Delete buttons
    function renderTimeline() {
      const timeline = document.getElementById('timeline');
      const saved = JSON.parse(localStorage.getItem('hashtweets') || '[]');
      
      if (saved.length === 0) {
        timeline.innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 20px;">No saved posts yet.</div>';
        return;
      }

      timeline.innerHTML = saved.map((item, index) => `
        <div class="card" style="margin-bottom: 12px;">
          <div class="card-header">
            <span>👤 Saved Note</span>
            <span>${item.date}</span>
          </div>
          <div class="card-content">${escapeHTML(item.text)}</div>
          <div class="card-actions">
            <button class="btn btn-danger" onclick="deletePost(${index})">🗑️ Delete</button>
          </div>
        </div>
      `).join('');
    }

    // Escape HTML to prevent XSS
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // Show Notification Alert
    function showAlert(msg) {
      alertBox.textContent = msg;
      alertBox.style.display = 'block';
      setTimeout(() => { alertBox.style.display = 'none'; }, 4000);
    }

    // Export complete HTML source as single file
    function exportHTML() {
      const blob = new Blob([document.documentElement.outerHTML], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'hashtweet.html';
      a.click();
    }

    window.addEventListener('hashchange', checkUrlHash);
    
    checkUrlHash();
    renderTimeline();
  </script>
</body>
</html>
