        * {

</head>

        <h1 class="matrix-title text-4xl sm:text-6xl md:text-7xl lg:text-8xl font-black uppercase tracking-widest my-2">

        </h1>

        <p class="matrix-subtitle text-xs sm:text-sm md:text-base mt-4 uppercase font-medium">
            // Awakening consciousness through digital harmony //
        </p>

        <!-- Dynamic Live Words Ticker -->
        <div class="mt-8 pt-6 border-t border-green-500/20 flex flex-wrap justify-center items-center gap-2 sm:gap-3 text-xs sm:text-sm text-green-300/80 code-font">
            <span class="px-2.5 py-1 rounded-md bg-green-950/40 border border-green-500/30">🧘🏼‍♂️ Asana</span>
            <span class="px-2.5 py-1 rounded-md bg-green-950/40 border border-green-500/30">🌬️ Pranayama</span>

        <div class="mt-8 flex flex-wrap justify-center gap-4 text-xs code-font">

            </button>

            </button>

                ✨ Zen Pulse Burst
            </button>

    <!-- Script to execute Matrix Animation logic -->
    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        // Fit canvas to window
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();

        // Specific Yoga-related terms & sacred Sanskrit vocabulary
        const yogaWords = [
            "YOGA ANURAG", "ASANA", "PRANAYAMA", "DHYANA", "CHAKRA", "KUNDALINI",
            "SAMADHI", "NAMASTE", "AHIMSA", "MOKSHA", "TAPAS", "SATYA",
            "SURYA NAMASKAR", "PADMASANA", "SAVASANA", "MANTRA", "MUDRA",
            "SHANTI", "BHAFTI", "KARMA", "VANYASA", "BANDHA", "PRANA",
            "KRIYA", "GURU", "SUTRA", "TANTRA", "OM", "KOSHA", "NADI",
            "MULADHARA", "SWADHISTHANA", "MANIPURA", "ANAHATA", "VISHUDDHA",
            "AJNA", "SAHASRARA", "DHARANA", "SAMYAMA", "AYURVEDA"
        ];

        // Sanskrit symbol characters mixed for classic Matrix code aesthetic
        const sanskritChars = "ॐ 卐 🕉️ float balance flow breath body mind soul spirit 01010101";

        // Main Matrix Column Settings
        const fontSize = 16;
        let columns = Math.floor(canvas.width / fontSize);

        // Store drops state
        let drops = [];
        let dropWords = [];
        let dropSpeeds = [];

        function initDrops() {
            columns = Math.floor(canvas.width / fontSize);
            drops = [];
            dropWords = [];
            dropSpeeds = [];

            for (let i = 0; i < columns; i++) {
                drops[i] = Math.random() * -100; // staggered start height
                // Pick random Yoga word or Sanskrit string sequence
                const isWord = Math.random() > 0.35;
                dropWords[i] = isWord ? yogaWords[Math.floor(Math.random() * yogaWords.length)] : sanskritChars;
                dropSpeeds[i] = (Math.random() * 0.8) + 0.6; // random speed multiplier
            }
        }

        initDrops();

        // Color Themes
        const colorPalettes = {
            emerald: { text: "#22c55e", head: "#ffffff", glow: "rgba(34, 197, 94, 0.8)" },
            gold: { text: "#eab308", head: "#fff7ed", glow: "rgba(234, 179, 8, 0.8)" },
            cyan: { text: "#06b6d4", head: "#f0fdf4", glow: "rgba(6, 182, 212, 0.8)" },
            purple: { text: "#a855f7", head: "#faf5ff", glow: "rgba(168, 85, 247, 0.8)" }
        };

        let currentPaletteKey = 'emerald';
        let speedMultiplier = 1.0;

        // Draw loop
        function drawMatrix() {
            // Semi-transparent overlay to create classic Matrix trailing/fading effect
            ctx.fillStyle = 'rgba(0, 0, 0, 0.07)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const palette = colorPalettes[currentPaletteKey];
            ctx.font = `${fontSize}px 'Fira Code', monospace`;

            for (let i = 0; i < drops.length; i++) {
                const textSource = dropWords[i];
                // Select a single character or full vertical character stream
                const charIndex = Math.floor(Math.abs(drops[i])) % textSource.length;
                const char = textSource.charAt(charIndex) || textSource[0];

                const x = i * fontSize;
                const y = drops[i] * fontSize;

                // Highlight the leading character bright white / glowing
                if (Math.random() > 0.92) {
                    ctx.fillStyle = palette.head;
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = palette.glow;
                } else {
                    ctx.fillStyle = palette.text;
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = palette.text;
                }

                ctx.fillText(char, x, y);

                // Reset drop to top once off screen with random stagger
                if (y > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                    // Re-assign word randomly on new cycle
                    const isWord = Math.random() > 0.3;
                    dropWords[i] = isWord ? yogaWords[Math.floor(Math.random() * yogaWords.length)] : sanskritChars;
                }

                // Advance drop location
                drops[i] += dropSpeeds[i] * speedMultiplier;
            }
        }

        // Animation Loop Handler
        let animationFrameId;
        function animate() {
            drawMatrix();
            animationFrameId = requestAnimationFrame(animate);
        }

        // Handle Window Resizing
        window.addEventListener('resize', () => {
            resizeCanvas();
            initDrops();
        });

        // Interactive Features
        const speedBtn = document.getElementById('toggleSpeedBtn');
        const speedLevels = [
            { label: "⚡ Speed: Normal", value: 1.0 },
            { label: "🚀 Speed: Zen Warp", value: 2.2 },
            { label: "🧘 Speed: Meditative", value: 0.5 }
        ];
        let currentSpeedIdx = 0;

        speedBtn.addEventListener('click', () => {
            currentSpeedIdx = (currentSpeedIdx + 1) % speedLevels.length;
            speedMultiplier = speedLevels[currentSpeedIdx].value;
            speedBtn.innerText = speedLevels[currentSpeedIdx].label;
        });

        const colorBtn = document.getElementById('toggleColorBtn');
        const colorKeys = Object.keys(colorPalettes);
        let currentColorIdx = 0;

        colorBtn.addEventListener('click', () => {
            currentColorIdx = (currentColorIdx + 1) % colorKeys.length;
            currentPaletteKey = colorKeys[currentColorIdx];
            colorBtn.innerText = `🎨 Aura: ${currentPaletteKey.charAt(0).toUpperCase() + currentPaletteKey.slice(1)}`;
        });

        // Interactive Click/Touch Pulse Effect
        const burstBtn = document.getElementById('burstBtn');
        burstBtn.addEventListener('click', triggerZenPulse);

        function triggerZenPulse() {
            // Speed up all rain temporarily
            for (let i = 0; i < drops.length; i++) {
                drops[i] += Math.random() * 15;
            }
            // Flash Canvas background briefly
            ctx.fillStyle = 'rgba(34, 197, 94, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // Interactive mouse click ripple on canvas
        window.addEventListener('click', (e) => {
            // Don't trigger if clicked on card/buttons
            if (e.target.tagName === 'BUTTON' || e.target.closest('main')) return;
            
            const clickCol = Math.floor(e.clientX / fontSize);
            const radius = 6;
            for (let i = clickCol - radius; i <= clickCol + radius; i++) {
                if (i >= 0 && i < drops.length) {
                    drops[i] = Math.max(0, drops[i] - Math.random() * 20);
                }
            }
        });

        // Start matrix animation on load
        window.onload = () => {
            animate();
        };
    </script>
</body>
</html>
